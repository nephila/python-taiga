[metadata]
name = python-taiga
version = attr: taiga.__version__
url = https://github.com/nephila/python-taiga
author = Nephila
author_email = team@team.nephila.digital
description = Taiga python API
long_description = file: README.rst, HISTORY.rst
long_description_content_type = text/x-rst
license = MIT
license_files = LICENSE
keywords = taiga kanban wrapper api
classifiers =
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Operating System :: OS Independent
    Development Status :: 5 - Production/Stable
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
include_package_data = True
install_requires =
    requests>2.11
    python-dateutil>=2.4
    pyjwkest>=1.0
packages = find:
python_requires = >=3.11
setup_requires =
	setuptools
zip_safe = False
test_suite = tests

[options.packages.find]
include =
    taiga
    taiga.*

[options.package_data]
* = *.txt, *.rst
taiga = *.html *.png *.gif *js *jpg *jpeg *svg *py *mo *po

[options.entry_points]
console_scripts =
    taiga-mcp-server = taiga.mcp_server.cli:main

[options.extras_require]
docs =
	sphinx
    sphinx-rtd-theme
mcp =
    fastmcp>=3.0

[sdist]
formats = zip

[bdist_wheel]
universal = 1
